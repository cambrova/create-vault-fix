modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/create-vault-fix/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx"
logoFile = "assets/vault_item_loss_fix/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Item vaults that span more than one chunk no longer lose items when part of them unloads and loads again (Create issue #4370).'''

[[mixins]]
config = "vault_item_loss_fix.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "create"
type = "required"
versionRange = "[6.0.0,)"
ordering = "AFTER"
side = "BOTH"
